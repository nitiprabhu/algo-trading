name: Trigger Positional Stocks Analysis

# Single scheduled trigger at 15:00 IST (GitHub Actions cron -- also wakes a
# sleeping Render free-tier instance, which the in-process daily loop can't
# rely on). Runs all three positional-stock pools (largecap + midcap +
# smallcap). The Upstox WhatsApp/app approval push is event-driven, not
# scheduled separately here: positional_stocks_runtime.py fires it itself,
# only at the moment a live-qualifying BUY/SELL is actually found and no
# valid token exists yet (see upstox_broker.maybe_request_token()). No
# signal that day -> no approval ask at all.
on:
  schedule:
    - cron: "30 9 * * 1-5"   # 15:00 IST -> positional analysis (fills before 15:30 close)
  workflow_dispatch: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    environment: default
    strategy:
      matrix:
        pool: [positional_stocks, positional_stocks_midcap, positional_stocks_smallcap]
    steps:
      - name: Trigger ${{ matrix.pool }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${{ vars.CHARTEDGE_API_HOST }}/api/${{ matrix.pool }}/trigger" \
            -H "X-Trigger-Key: ${{ secrets.TRIGGER_API_KEY }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $http_code"; echo "$body"
          # 503 = that pool not enabled in config -> skip, not a failure
          if [ "$http_code" -ge 400 ] && [ "$http_code" -ne 503 ]; then
            echo "::error::${{ matrix.pool }} trigger failed with HTTP $http_code"; exit 1
          fi
