# systemd drop-in: alert on crash/restart/stop via Telegram.
# Install on VPS: see deploy/README.md.
[Service]
OnFailure=notify-service-failure.service
# Fires on every stop (deploy restart, manual stop, crash, or machine
# shutdown -- systemd stops this service as part of any shutdown sequence).
ExecStopPost=/opt/algo-trading/deploy/notify_service_stop.sh
