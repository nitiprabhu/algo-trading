# systemd drop-in: alert on crash/restart via Telegram.
# Install on VPS:
#   mkdir -p /etc/systemd/system/algo-trading.service.d
#   cp algo-trading-override.conf /etc/systemd/system/algo-trading.service.d/override.conf
#   cp notify_service_failure.sh /opt/algo-trading/deploy/notify_service_failure.sh
#   chmod +x /opt/algo-trading/deploy/notify_service_failure.sh
#   systemctl daemon-reload
[Service]
OnFailure=notify-service-failure.service
