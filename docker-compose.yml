services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -e . && uvicorn services.chartedge_core.api:app --host 0.0.0.0 --port 7000"
    ports:
      - "7070:7000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "9000:3000"
    volumes:
      - .:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:7070
    depends_on:
      - api

