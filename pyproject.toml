[project]
name = "chartedge-ai"
version = "0.1.0"
description = "NSE intraday technical analysis paper-trading platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "websockets>=15.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "sqlmodel>=0.0.22",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["services", "services.*"]
exclude = ["frontend*", "shared*", "tests*", "extracted_pages*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.poetry]
package-mode = false
