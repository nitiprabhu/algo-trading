risk:
  total_capital: 500000
  notional_per_trade: 500000
  max_open_positions: 2
  mutual_exclusion: false
  allow_margin: true
  max_signals_per_instrument_per_hour: 3
  confidence_floor: 60
  options_confidence_buffer: 5  # options require confidence_floor + this to filter theta-bleed entries
  options_max_loss_pct: 13.0
  options_trail_arm_pct: 15.0
  options_trail_keep_frac: 0.50
  cooldown_after_losses: 3      # tolerate 2 bad trades before pausing (was 2)
  daily_halt_after_losses: 5    # with 2L capital, 4 was too tight (was 4)
  trade_only_trending: true     # prior-day regime gate to block chop days
  options_directional_filter: false # DISABLED — tested Mar+Apr+May deterministically: option entries are already
                                    # trend-aligned by confluence (every CE has ema50>ema200), so a directional veto
                                    # never fires; the trend-strength variant removed net WINNERS (April -6.9k→-11.4k).
                                    # Kept as a config switch (off) for reference; do not re-enable without new evidence.
  dir_filter_min_sep_pct: 0.10
  options_min_trend_sep_pct: 0.10
  strategy_adx_gate: true       # apply intraday ADX trend gate to 5EMA/T315 strategy scalps
  adx_min_trend: 30.0           # ADX >= 30 = strong trend; 22 allowed too many chop trades
  daily_drawdown_pause_pct: 1.0 # Strict 1% daily capital limit inspired by Arjun Tandon
  futures_risk_per_trade_pct: 0.75 # Rupee risk per futures trade as % of capital; lots sized
                                    # down for wider strategy SL instead of firing at max_lots
                                    # regardless of SL distance (was risking up to 3x this on
                                    # wide-range ORB days — see futures_trader.py maybe_enter)
  stale_feed_seconds: 60
  price_deviation_guard_pct: 5.0
  timeframe_mins: 15
  options_expiry_buffer_days: 1
  options_strike_offset: 1  # 1 = ITM (delta ~0.65); 0 = ATM; -1 = OTM
  options_min_premium: 80.0 # Filter out cheap options where spreads dominate edge
  # ── VIX gate for option BUYING ───────────────────────────────────────────────
  # options_vix_max:   up to this VIX, buy freely (when ADX confirms trend)
  # options_vix_panic: above this VIX, block all option buys
  # adx_min_high_vix:  when VIX is between vix_max and vix_panic, require this ADX
  options_vix_max: 18.0     # moderate VIX zone — allow buys only with strong ADX
  options_vix_panic: 22.0   # extreme VIX — block all option buys unconditionally
  adx_min_high_vix: 32.0    # ADX floor for buys when VIX is 18–22

positional_risk:
  # Weekly NIFTY options -- separate module (positional_trading.py), separate
  # capital pool, isolated from intraday. See scratch/real_options_strategy_comparison.py
  # for the validation methodology (2yr real bhavcopy data).
  enabled: true           # LIVE: watch for Telegram entry/exit alerts during market hours
  data_source: upstox  # Upstox-only (REST, reuses the live_trading WhatsApp/app
                           # token-approval flow -- see positional_data_provider.py)
  mode: single             # single (1 engine, `strategy` below)
  strategy: condor        # used when mode: single. condor (default, bounded risk) |
                           # straddle (undefined risk, highest raw profit) | credit_spread
                           # (lowest variance) | iv_gated_straddle (undefined risk,
                           # entries only on rich-IV weeks -- best 2yr Sharpe of all 4,
                           # see positional_trading.py)
  capital: 100000.0       # separate allocation, not shared with intraday total_capital
  lot_size: 65            # NIFTY lot size (SEBI revised 25->75->65; confirmed via Upstox
                           # /option/contract lot_size field 2026-07-28 -- update if changed again)
  profit_take_frac: 0.55
  stop_credit_mult: 1.1   # tighter stop for lower per-trade pain; see positional_trading.py comment
  short_sigma_mult: 0.85
  wing_sigma_mult: 1.30
  live_trading:
    # Real Upstox F&O basket orders mirroring the paper condor decisions --
    # see upstox_options_broker.py. Own gates, independent of the stock
    # pools' live_trading block: arming one never arms the other.
    # Funds are COMMON-POOL with the stock pools: the broker queries live
    # free balance + live basket margin from Upstox before every entry and
    # skips the week if it doesn't fit (fail closed on any API error).
    # 1yr backtest basis (run_1year_positional_backtest.py, Jul25-Jul26):
    # condor +₹41.9k on ₹1L, max single loss -₹6.9k, max drawdown -₹12.4k.
    enabled: true          # dry-run observation week first (orders logged, nothing placed)
    dry_run: true          # paused 2026-07-28 -- F&O segment not yet activated on Upstox
                           # (UDAPI100500), reactivation raised, ETA 2-3 days. Flip to false
                           # once segment shows active.
    max_margin: 100000.0   # hard cap on margin this module may consume from the common pool

positional_stocks_risk:
  # Large-cap technical INVESTMENT -- long-only, daily-swing signals. Fully
  # separate module (positional_stocks.py), separate capital pool, own DB
  # table (StockPositionRecord). BUY-only: a position can only be opened by
  # a BUY signal; SELL signals only close an existing position, never open
  # a short. See positional_stocks.py module docstring for the full
  # indicator/pattern list (RSI, MACD, EMA, Supertrend, ADX, Golden Cross,
  # 52-week range, Donchian breakout, Bollinger squeeze, MA pullback, Cup &
  # Handle).
  #
  # Data source: yfinance (NSE tickers, e.g. RELIANCE.NS) -- NOT the
  # INDmoney/indstocks feed used by intraday/options. No API token, no
  # daily expiry, no manual re-auth: fully unattended.
  #
  # Params below are backtest-validated on 2yr real NSE daily data
  # (run_positional_stocks_backtest.py): 20-stock universe, 12mo window ->
  # 50 trades, 60% win rate, +9.78% return, 2.10x profit factor. The
  # 4-stock/no-trend-gate version tested first (RELIANCE/HDFCBANK/TCS/INFY,
  # threshold 0.50, no require_trend_gate) was NEGATIVE (-1.3% to -5.5%
  # across 6/12/24mo windows) -- wider universe + hard trend gate + trailing
  # stop is what flipped it profitable. Do not shrink the universe or drop
  # require_trend_gate without re-backtesting.
  enabled: true
  capital: 100000.0       # separate allocation, not shared with intraday or options positional capital
  max_positions: 5        # equal-slot capital sizing: capital / max_positions per stock
  stop_loss_pct: 4.0
  target_pct: 12.0
  buy_threshold: 0.35
  sell_threshold: -0.35
  min_adx: 25.0           # skip BUY entries when ADX below this (avoid chop)
  require_trend_gate: true  # hard AND-gate: EMA ribbon + Supertrend both bullish, not just weighted score
  trail_arm_pct: 3.0      # once a position peaks at +3%, stop trusting weak SELL_SIGNAL exits
  trail_keep_frac: 0.5    # trailing stop locks in 50% of peak gain once armed
  yfinance_period: "2y"   # daily bars pulled per check; 2y gives Golden Cross/Cup&Handle enough history
  symbols: [SBIN, ADANIENT, VEDL, ONGC, HINDALCO]  # top 5 by 12mo backtest CAGR (22.69%)
  reentry_cooldown_sessions: 2  # wait 2 trading sessions before re-entering an exited symbol
  check_after_time: "15:00"  # IST cutoff -- runs once per day after this time, not every 5 min

positional_stocks_midcap_risk:
  # Midcap + Nifty Next50 sibling of positional_stocks_risk above -- same
  # engine (positional_stocks.py), same signal/exit logic, own capital pool
  # and own "midcap" tag on the shared StockPositionRecord table (see
  # database.py pool column). Universe: 122-symbol Nifty Midcap150 + Next50
  # screen (2yr yfinance daily data, isolated-capital screen per symbol via
  # screen_positional_stocks.py), top 8 by screen return% selected here.
  #
  # Portfolio backtest (run_positional_stocks_backtest.py, max_positions=8,
  # last 12mo): 74 trades, 66.2% win rate, +26.55% return -> 26.99% CAGR,
  # 3.03x profit factor -- beats the largecap 5-stock CAGR (22.69%) and has
  # a better profit factor than the midcap top-5 (2.79x) or top-10 (2.82x,
  # CAGR drops to 23.4% -- HAL was net-negative and diluted returns).
  # Do not add HAL back without re-backtesting; do not shrink below 8
  # without checking single-name concentration risk (2 Adani-family names
  # in a wider top-10 basket are correlated, not real diversification).
  enabled: true
  capital: 100000.0
  max_positions: 8
  confidence_sizing: true  # per-user request: no fixed equal slot -- stronger confluence
                            # score gets a bigger allocation (1x-2x base slot), capped by
                            # remaining undeployed capital in the 1L pool. See
                            # PositionalStocksEngine._sized_allocation in positional_stocks.py.
  allow_rotation: true     # per-user request: act like a portfolio manager -- when the pool
                            # is fully deployed and a new signal qualifies but has nowhere to
                            # go, sell the weakest open holding (lowest today's confluence
                            # score, and only if it hasn't already proven itself as a trailing
                            # winner) to free capital for the stronger new pick. See
                            # PositionalStocksEngine.maybe_rotate_and_enter.
  rotation_margin: 0.15    # new signal's score must beat the weakest holding's by this much
  stop_loss_pct: 4.0
  target_pct: 12.0
  buy_threshold: 0.35
  sell_threshold: -0.35
  min_adx: 25.0
  require_trend_gate: true
  trail_arm_pct: 3.0
  trail_keep_frac: 0.5
  yfinance_period: "2y"
  symbols: [LAURUSLABS, "M&MFIN", ASHOKLEY, IDEA, ADANIENSOL, MUTHOOTFIN, FEDERALBNK, NYKAA]
  reentry_cooldown_sessions: 2  # wait 2 trading sessions before re-entering an exited symbol
  check_after_time: "15:00"

positional_stocks_smallcap_risk:
  # Smallcap + microcap sibling of positional_stocks_risk / positional_stocks_midcap_risk
  # above -- same engine, same signal/exit logic, own "smallcap" capital pool. Universe:
  # 369-symbol Nifty Smallcap250 + Microcap250 screen (2yr yfinance daily data, isolated
  # per-symbol capital via screen_positional_stocks.py), top 10 by screen return% selected.
  #
  # Portfolio backtest (run_positional_stocks_backtest.py, max_positions=10, last 12mo):
  # 109 trades, 63.3% win rate, +44.19% return -> 44.96% CAGR, 3.34x profit factor.
  # Top-5/top-8 subsets of this same list backtested even higher (70.7% / 51.7% CAGR)
  # but are more concentrated -- STLTECH alone was ~35% of top-5's PnL. User chose the
  # full top-10 for the diversification.
  #
  # IMPORTANT CAVEAT (do not remove): this tier is materially riskier than largecap/midcap.
  # Screen spread ran +168% (BGRENERGY) to -86% (HERCULES) -- 2-3x the volatility of
  # midcap. Backtest fills assume execution at the daily close; several of these names
  # (e.g. BGRENERGY, DIACABS, APCOTEXIND) are thin-volume microcaps where a real order
  # from a 1L pool can move the price, and NSE circuit bands (5-10% on many smallcaps)
  # can gap past a modeled stop-loss with no fill that day. Treat backtest CAGR as a
  # ceiling, not a forecast.
  #
  # Capital budget: largecap (1L) + midcap (1L) + smallcap (1L) = 3L total, per user's
  # explicit portfolio-wide cap. Do not raise this pool's capital without cutting another
  # pool to stay under 3L combined.
  enabled: true
  capital: 100000.0
  max_positions: 10
  confidence_sizing: true
  allow_rotation: true
  rotation_margin: 0.15
  stop_loss_pct: 4.0
  target_pct: 12.0
  buy_threshold: 0.35
  sell_threshold: -0.35
  min_adx: 25.0
  require_trend_gate: true
  trail_arm_pct: 3.0
  trail_keep_frac: 0.5
  yfinance_period: "2y"
  symbols: [BGRENERGY, STLTECH, AXISCADES, HFCL, NATIONALUM, SOLARINDS, HINDCOPPER, DIACABS, INDIGRID, APCOTEXIND]
  reentry_cooldown_sessions: 2  # wait 2 trading sessions before re-entering an exited symbol
  check_after_time: "15:00"

futures_risk:
  NIFTY_FUT:
    lot_size: 65  # SEBI revised 25->75->65; confirmed via Upstox /option/contract 2026-07-28
    max_lots: 2
    sl_points: 50
    target_1_points: 75
    target_2_points: 150
    eod_exit: "15:10"
    session_entry_cutoff: "14:30"

# NSE weekly expiry day per instrument (Python weekday: 0=Mon, 1=Tue, ..., 3=Thu)
# NIFTY moved to Tuesday 2024-09; BANKNIFTY scrapped weeklies.
# Monthly expiry is always the last Thursday regardless of this map.
expiry_map:
  # NSE 2026: NIFTY weekly = Tuesday; monthly = last Tuesday. BANKNIFTY weeklies were
  # discontinued (2024) — monthly only, last Tuesday. Verified against live Zerodha
  # instrument list (e.g. BANKNIFTY26APR…→2026-04-28 Tue, NIFTY weekly 2026-05-05 Tue).
  NIFTY:
    weekly_weekday: 1       # Tuesday
    monthly_weekday: 1      # last Tuesday of month
  BANKNIFTY:
    weekly_weekday: null    # no weekly — monthly only
    monthly_weekday: 1      # last Tuesday of month
  DEFAULT:
    weekly_weekday: 1       # Tuesday fallback

# IV rank bands (based on rolling INDIAVIX history)
iv_rank:
  high_threshold: 70.0     # IV rank above this → prefer selling / debit-spreads
  low_threshold: 30.0      # IV rank below this → prefer buying
  lookback_days: 60        # trading days for rolling VIX range

# NSE F&O transaction costs — applied to every trade
costs:
  enabled: true
  brokerage_per_order: 20.0   # ₹20 flat
  stt_sell_pct: 0.001         # 0.1% on sell-side options turnover
  nse_txn_charge_pct: 0.00053
  sebi_fee_per_crore: 10.0
  gst_rate: 0.18
  stamp_duty_buy_pct: 0.00003
  # Realistic bid-ask spreads for ATM options (entry + exit each pay half-spread).
  # NIFTY ATM weekly: 3-5pts. BANKNIFTY ATM weekly: 5-8pts.
  default_spread:
    NIFTY: 4.0
    BANKNIFTY: 6.0
    DEFAULT: 4.0

# Option structure selection
options_structure:
  allow_margin: false          # set true when SPAN margin available
  prefer_itm: true             # buy ITM (strike_offset=1) on trend days
  itm_delta_target: 0.65       # approximate delta we aim for on ITM buys
  # short-premium structures (strangle, condor) are disabled until margin enabled

# Iron Condor SELL engine — activates only when VIX≤14 and market is range-bound
iron_condor:
  enabled: true
  vix_gate: 14.0              # sell premium only when VIX at or below this
  trend_gate_pct: 3.0         # skip if |5-day NIFTY move| exceeds this %
  short_delta: 0.20           # target delta for short strikes (~3 OTM at VIX 12-14)
  wing_delta: 0.10            # long wing delta (protection)
  profit_take_pct: 0.55       # close when condor buyback ≤ (1-PT)*credit
  stop_mult: 2.2              # close when condor worth > stop_mult * credit
  lookback_days: 5            # days of price history for trend gate


live_trading:
  # Real-money order execution for the positional-stocks pools via Upstox
  # REST v2 (services/chartedge_core/upstox_broker.py). BOTH gates below
  # default to the safe position -- a real order needs enabled: true AND
  # dry_run: false AND a valid same-day Upstox token. Leave as-is to run
  # the whole live path in simulation (logs intended orders, sends nothing).
  enabled: true             # MASTER KILL SWITCH. false = no live path at all.
  dry_run: false            # false = real orders. Funds-check in upstox_broker.py
                            # fails closed if the account has insufficient balance --
                            # safe to arm with ₹0/low funds to test the pipeline.
  broker: upstox
  order_type: MARKET        # entries/exits at market (near-close). LIMIT possible later.
  # WhatsApp/app token-approval push is event-driven, not scheduled here:
  # positional_stocks_runtime.py fires it (deduped per day) only at the
  # moment a live-qualifying BUY/SELL is found. No signal -> no ask.
  gtt_stop_pct: 4.0         # server-side GTT stop-loss %, matches engine stop_loss_pct.
                            # Lives on Upstox independent of the daily token -- protects
                            # open positions even if the daily approval is forgotten.
  reserve_for_options: 50000.0   # funds floor stock-pool BUYs must never dip below --
                            # keeps the weekly condor's margin (~50k cap) safe from the stock pools'
                            # own funds check, leaving remaining balance (~70k) available for
                            # positional stocks. See upstox_broker.py place_entry() and
                            # upstox_options_broker.py's COMMON-POOL FUNDS docstring.
  # NO gtt target leg by design: a server-side target would force an exit while
  # re-entry needs the (possibly absent) token -> manufactured missed opportunity.
  # Targets/trailing/sell-signal stay dynamic in the engine.
  #
  # symbol -> Upstox instrument_key. REQUIRED per symbol before it can trade
  # live; a symbol missing here is skipped (fail-closed), never guessed.
  # Resolved via scripts/resolve_upstox_keys.py against the Upstox instrument
  # master on 2026-07-15. BGRENERGY/STLTECH are BE (Trade-to-Trade/surveillance,
  # tighter circuits) and INDIGRID is an InvIT (not a stock) -- flagged, not
  # excluded, since they're still delivery-tradeable.
  instrument_keys:
    SBIN: "NSE_EQ|INE062A01020"
    ADANIENT: "NSE_EQ|INE423A01024"
    VEDL: "NSE_EQ|INE205A01025"
    ONGC: "NSE_EQ|INE213A01029"
    HINDALCO: "NSE_EQ|INE038A01020"
    LAURUSLABS: "NSE_EQ|INE947Q01028"
    "M&MFIN": "NSE_EQ|INE774D01024"
    ASHOKLEY: "NSE_EQ|INE208A01029"
    IDEA: "NSE_EQ|INE669E01016"
    ADANIENSOL: "NSE_EQ|INE931S01010"
    MUTHOOTFIN: "NSE_EQ|INE414G01012"
    FEDERALBNK: "NSE_EQ|INE171A01029"
    NYKAA: "NSE_EQ|INE388Y01029"
    BGRENERGY: "NSE_EQ|INE661I01014"  # BE -- surveillance segment, review
    STLTECH: "NSE_EQ|INE089C01029"    # BE -- surveillance segment, review
    AXISCADES: "NSE_EQ|INE555B01013"
    HFCL: "NSE_EQ|INE548A01028"
    NATIONALUM: "NSE_EQ|INE139A01034"
    SOLARINDS: "NSE_EQ|INE343H01029"
    HINDCOPPER: "NSE_EQ|INE531E01026"
    DIACABS: "NSE_EQ|INE989C01038"
    INDIGRID: "NSE_EQ|INE219X23014"   # IV -- InvIT, not equity, review
    APCOTEXIND: "NSE_EQ|INE116A01032"
